<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner ambient circle -->
  <circle cx="256" cy="256" r="190" fill="#0f172a" opacity="0.15"/>

  <!-- Thali / Plate Outline -->
  <circle cx="256" cy="265" r="150" fill="none" stroke="#ffffff" stroke-width="14" stroke-opacity="0.95"/>
  <circle cx="256" cy="265" r="130" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" stroke-opacity="0.6"/>

  <!-- Center Bowl / Katori -->
  <circle cx="256" cy="265" r="50" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="265" r="38" fill="#f97316"/>
  
  <!-- Food / Spice Sparkle dots in Thali -->
  <circle cx="200" cy="210" r="28" fill="#f8fafc" stroke="#f97316" stroke-width="6"/>
  <circle cx="312" cy="210" r="28" fill="#f8fafc" stroke="#f97316" stroke-width="6"/>
  <circle cx="200" cy="320" r="28" fill="#f8fafc" stroke="#f97316" stroke-width="6"/>
  <circle cx="312" cy="320" r="28" fill="#f8fafc" stroke="#f97316" stroke-width="6"/>

  <!-- Steam / Aroma wave -->
  <path d="M236 120 C 236 100, 246 90, 246 70" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M256 125 C 256 105, 268 95, 268 75" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M276 120 C 276 100, 286 90, 286 70" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
